name: Build WordPop Kids v2 APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'WordPopKidsV2Android.zip'
      - '.github/workflows/build-v2.yml'
  workflow_dispatch:

jobs:
  build-v2-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip WordPop Kids v2 project
        run: unzip -o WordPopKidsV2Android.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build v2 Debug APK
        working-directory: WordPopKidsV2Android
        run: gradle assembleDebug --stacktrace

      - name: Upload v2 APK
        uses: actions/upload-artifact@v4
        with:
          name: WordPop-Kids-v2-APK
          path: WordPopKidsV2Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
